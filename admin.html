<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - סיפורי סבא</title>

  <style>
    body {
      font-family: Arial;
      direction: rtl;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .login-box {
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>

<body>

<div class="box login-box" id="loginBox">
  <h2>התחברות אדמין</h2>
  <button id="loginBtn">התחבר עם Google</button>
</div>

<div class="box hidden" id="adminBox">
  <h2>יצירת פרק חדש</h2>

  <input id="title" placeholder="כותרת הפרק" />
  <input id="shortDesc" placeholder="תיאור קצר" />
  <textarea id="fullDesc" placeholder="תיאור מלא"></textarea>
  <input id="link" placeholder="קישור יוטיוב" />
  <input id="series" placeholder="סדרה (stories/parasha)" />
  <input id="publishAt" placeholder="תאריך פרסום" />

  <input id="pdfName" placeholder="שם PDF (לא חובה)" />
  <input id="pdf" placeholder="קישור PDF (לא חובה)" />

  <button id="saveBtn">שמור פרק</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { 
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBAMnTuMwt83UU2JNBhcOty8CN4elv8_oM",
  authDomain: "siporeysaba-100.firebaseapp.com",
  projectId: "siporeysaba-100",
  storageBucket: "siporeysaba-100.appspot.com",
  messagingSenderId: "780184204501",
  appId: "1:780184204501:web:8314e52e46d9635d69de5c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- LOGIN ---------- */
const loginBtn = document.getElementById("loginBtn");
const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");

loginBtn.onclick = async () => {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

/* ---------- AUTH CHECK ---------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    loginBox.style.display = "block";
    adminBox.classList.add("hidden");
    return;
  }

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists() || snap.data().role !== "admin") {
    alert("אין הרשאה");
    window.location.href = "index.html";
    return;
  }

  loginBox.style.display = "none";
  adminBox.classList.remove("hidden");

  console.log("אדמין מחובר ✔");
});

/* ---------- SAVE EPISODE ---------- */
document.getElementById("saveBtn").onclick = async () => {
  try {
    await addDoc(collection(db, "episodes"), {
      title: document.getElementById("title").value,
      shortDesc: document.getElementById("shortDesc").value,
      fullDesc: document.getElementById("fullDesc").value,
      link: document.getElementById("link").value,
      series: document.getElementById("series").value,
      publishAt: document.getElementById("publishAt").value,
      pdfName: document.getElementById("pdfName").value,
      pdf: document.getElementById("pdf").value
    });

    alert("נשמר בהצלחה ✔");
  } catch (e) {
    alert("שגיאה בשמירה");
    console.error(e);
  }
};
</script>

</body>
</html>
