<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - סיפורי סבא</title>

  <style>
    body {
      font-family: Arial;
      direction: rtl;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>התחברות אדמין</h2>
  <button id="loginBtn">התחבר עם Google</button>
</div>

<div class="box hidden" id="adminBox">
  <h2>יצירת פרק חדש</h2>

  <input id="title" placeholder="כותרת הפרק" />
  <input id="shortDesc" placeholder="תיאור קצר" />
  <textarea id="fullDesc" placeholder="תיאור מלא"></textarea>
  <input id="link" placeholder="קישור יוטיוב" />
  <input id="series" placeholder="סדרה (stories/parasha)" />
  <input id="publishAt" placeholder="תאריך פרסום" />

  <input id="pdfName" placeholder="שם PDF (לא חובה)" />
  <input id="pdf" placeholder="קישור PDF (לא חובה)" />

  <button id="saveBtn">שמור פרק</button>
</div>

<script type="module">
import { db, auth } from "./firebase.js";
import {
  collection,
  addDoc,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  
/* UI */
const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

/* AUTH STATE */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    loginBox.classList.remove("hidden");
    adminBox.classList.add("hidden");
    return;
  }

  // בדיקת הרשאה (אופציונלי)
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (snap.exists() && snap.data().role === "admin") {
    loginBox.classList.add("hidden");
    adminBox.classList.remove("hidden");
  } else {
    alert("אין הרשאה");
    await auth.signOut();
  }
});

/* SAVE */
document.getElementById("saveBtn").onclick = async () => {
  await addDoc(collection(db, "episodes"), {
    title: title.value,
    shortDesc: shortDesc.value,
    fullDesc: fullDesc.value,
    link: link.value,
    series: series.value,
    publishAt: publishAt.value,
    pdfName: pdfName.value,
    pdf: pdf.value
  });

  alert("נשמר בהצלחה ✔");
};
</script>

</body>
</html>
