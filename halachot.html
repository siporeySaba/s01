<div class="hl-viewer" id="hlViewer" hidden><button type="button" class="hl-close" aria-label="סגירה">✕</button><img alt=""></div>
<style>
.hl-topic h2{margin:26px 0 12px}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:0;margin:0;list-style:none}
.hl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.hl-card button.hl-open{display:block;border:0;padding:0;margin:0;background:none;cursor:zoom-in}
.hl-card img{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:cover;object-position:top}
.hl-body{padding:12px 14px 14px;display:grid;gap:8px;flex:1}
.hl-body b{font-size:1.02rem}
.hl-body p{margin:0;font-size:.9rem;line-height:1.5;opacity:.85}
.hl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.hl-actions a{font-size:.85rem;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.hl-actions a:hover{border-color:var(--accent)}
.hl-actions a.wa{background:#25d366;border-color:#25d366;color:#fff}
.hl-viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.hl-viewer[hidden]{display:none}
.hl-viewer img{max-width:min(560px,100%);height:auto;border-radius:12px;margin:auto}
.hl-close{position:fixed;top:12px;left:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:1.2rem;cursor:pointer}
</style>
<script>
(function(){
  const wrap=document.getElementById("hlTopics"),viewer=document.getElementById("hlViewer"),vimg=viewer.querySelector("img");
  const site="https://siporeysaba.com/";
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  fetch("halachot/halachot.json",{cache:"no-store"}).then(r=>r.json()).then(list=>{
    const topics={};list.forEach(x=>(topics[x.topic]=topics[x.topic]||[]).push(x));
    wrap.innerHTML=Object.entries(topics).map(([t,items])=>`<section class="hl-topic"><h2>${esc(t)}</h2><ul class="hl-grid">${items.map(x=>{
      const full="halachot/"+x.file,share=encodeURIComponent(`${t} – ${x.title} 🕎
${site}${full}

עוד הלכות, סיפורים והפעלות: ${site}halachot.html`);
      return `<li class="hl-card"><button type="button" class="hl-open" data-src="${full}" aria-label="הגדלת התמונה"><img src="halachot/${x.thumb}" alt="${esc(t+" – "+x.title)}" loading="lazy" width="360" height="640"></button>
      <div class="hl-body"><b>${esc(x.title)}</b><p>${esc(x.desc)}</p><div class="hl-actions"><a href="${full}" download><i class="fa-solid fa-download"></i> הורדה</a><a class="wa" href="https://wa.me/?text=${share}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> שיתוף</a></div></div></li>`}).join("")}</ul></section>`).join("");
  }).catch(()=>wrap.innerHTML="<p>לא הצלחנו לטעון את ההלכות. נסו לרענן.</p>");
  wrap.addEventListener("click",e=>{const b=e.target.closest(".hl-open");if(!b)return;vimg.src=b.dataset.src;viewer.hidden=false;document.body.style.overflow="hidden";});
  const close=()=>{viewer.hidden=true;document.body.style.overflow="";vimg.src="";};
  viewer.addEventListener("click",e=>{if(e.target!==vimg)close();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!viewer.hidden)close();});
})();
</script>
