name: Weekly newsletter

on:
  schedule:
    # יום רביעי 05:23 UTC = 07:23 בחורף / 08:23 בקיץ שעון ישראל
    - cron: "23 5 * * 3"
  workflow_dispatch:
    inputs:
      test_to:
        description: "שליחת בדיקה לכתובת אחת בלבד (ריק = שליחה רגילה)"
        default: ""
      force_file:
        description: "לשלוח עלון מסוים (למשל vayishlach.pdf) גם אם כבר נשלח"
        default: ""
      dry_run:
        description: "הרצה יבשה (רק ספירת נמענים)"
        type: boolean
        default: false

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node send-newsletter.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: siporeysaba@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_TO: ${{ inputs.test_to }}
          FORCE_FILE: ${{ inputs.force_file }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
